<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINWARDANA HUB</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- PENTING: Tempat otomatis header & navbar masuk -->
    <div id="header"></div>

    <!-- HERO BANNER -->
    <div class="hero">
        <img src="assets/img/hero.jpg" alt="Hero" class="hero-image">
        <div class="hero-overlay">
            <h1>FINWARDANA HUB</h1>
            <p>Games • Tools • Projects</p>
        </div>
    </div>

    <!-- KONTEN UTAMA / SLIDER -->
    <div class="section">
        <div class="section-title">RECENT</div>
        <div class="slider" id="recent-slider"></div>

        <div class="section-title">TOOLS</div>
        <div class="slider" id="tools-slider"></div>

        <div class="section-title">GAMES</div>
        <div class="slider" id="games-slider"></div>
    </div>

    <!-- PENTING: Tempat otomatis footer masuk -->
    <div id="footer"></div>

    <!-- SCRIPT -->
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
