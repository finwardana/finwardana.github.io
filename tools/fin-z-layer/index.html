<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin Z Layer (FZL)</title>
    <link rel="stylesheet" href="../../css/style.css">
    
    <style>
        .detail-container {
            padding: 16px;
            max-width: 800px;
            margin: auto;
            margin-top: 10px; 
        }

        .hero-backdrop {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            background-image: url('thumb.webp'); 
            background-size: cover;
            background-position: center;
            margin-bottom: 16px;
            box-shadow: inset 0 -80px 50px -10px var(--bg); 
            border: 1px solid var(--border);
        }

        .detail-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .meta-badge {
            background: #222;
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .btn-primary {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: #fff;
            color: #000;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 24px;
            transition: 0.2s;
        }

        .btn-primary:active {
            background: #ccc;
        }

        .detail-desc {
            font-size: 13px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 24px;
        }

        .detail-stats {
            display: flex;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            margin-bottom: 24px;
        }

        .stat-box {
            flex: 1;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-box strong {
            font-size: 15px;
            font-weight: 900;
        }

        .detail-tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .tab-item {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
            padding-bottom: 10px;
            cursor: pointer;
        }

        .tab-item.active {
            color: var(--text);
            border-bottom: 2px solid var(--text);
        }
    </style>
</head>
<body>

    <!-- PENTING: Tempat Header & Navbar -->
    <div id="header"></div>

    <div class="detail-container">
        <!-- Banner -->
        <div class="hero-backdrop"></div>

        <h1 class="detail-title">FZL (FIN Z LAYER)</h1>
        <div class="detail-meta">
            <span class="meta-badge">Web App</span>
            <span>Animation</span>
            <span>Editor</span>
        </div>

        <a href="play/" class="btn-primary">
            BUKA TOOLS
        </a>

        <!-- Deskripsi Tools -->
        <div class="detail-desc">
            <p style="margin-bottom: 10px;">Fitur utama:</p>
            <ul style="padding-left: 18px; display: flex; flex-direction: column; gap: 6px;">
                <li>Animasi paralaks 2.5D & kamera <em>fly-through</em>.</li>
                <li>Sistem multi-layer objek.</li>
                <li>Pengaturan keyframe scene.</li>
                <li>Fitur Auto-Animate looping otomatis.</li>
            </ul>
        </div>

        <div class="detail-stats">
            <div class="stat-box">
                <span>Rilis</span>
                <strong>2026</strong>
            </div>
            <div class="stat-box">
                <span>Versi</span>
                <strong>1.0.0</strong>
            </div>
        </div>

        <div class="detail-tabs">
            <div class="tab-item active">Details</div>
            <div class="tab-item">Updates</div>
            <div class="tab-item">Related</div>
        </div>
    </div>

    <!-- PENTING: Tempat Footer -->
    <div id="footer"></div>

    <!-- SCRIPT LAYOUT & UTAMA (Pastikan jalurnya benar pakai ../../) -->
    <script src="../../js/layout.js"></script>
    <script src="../../js/main.js"></script>

</body>
</html>
