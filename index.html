<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINWARDANA</title>
    <!-- Pastikan jalur file CSS ini benar -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Container Header (Dimuat otomatis oleh layout.js) -->
    <div id="header"></div>

    <!-- Konten Utama -->
    <main class="section">
        
        <!-- Hero Banner & Tombol Search -->
        <div class="hero-container">
            <div class="hero">
                <!-- Background Hero Polos (Abu-abu / Surface) -->
                <div class="hero-bg"></div>
                
                <!-- Karakter Terpisah di Kiri (Ukurannya pas di dalam banner) -->
                <img src="assets/img/character.png" alt="Character" class="hero-character">
                
                <!-- 5 Status Bars di Sebelah Kanan Karakter -->
                <div class="status-bars-container">
                    <div class="status-title">FINWARDANA STATUS</div>
                    
                    <!-- 1. Creative Spark -->
                    <div class="status-item">
                        <div class="status-info">
                            <span class="status-label">CREATIVE SPARK</span>
                            <span class="status-value">100%</span>
                        </div>
                        <div class="bar-frame">
                            <div class="bar-fill creative-fill" style="width: 100%;"></div>
                        </div>
                    </div>

                    <!-- 2. Social Battery -->
                    <div class="status-item">
                        <div class="status-info">
                            <span class="status-label">SOCIAL BATTERY</span>
                            <span class="status-value">15%</span>
                        </div>
                        <div class="bar-frame">
                            <div class="bar-fill energy-fill" style="width: 15%;"></div>
                        </div>
                    </div>

                    <!-- 3. Consistency -->
                    <div class="status-item">
                        <div class="status-info">
                            <span class="status-label">CONSISTENCY</span>
                            <span class="status-value">30%</span>
                        </div>
                        <div class="bar-frame">
                            <div class="bar-fill consistency-fill" style="width: 30%;"></div>
                        </div>
                    </div>

                    <!-- 4. Boredom -->
                    <div class="status-item">
                        <div class="status-info">
                            <span class="status-label">BOREDOM</span>
                            <span class="status-value">85%</span>
                        </div>
                        <div class="bar-frame">
                            <div class="bar-fill boredom-fill" style="width: 85%;"></div>
                        </div>
                    </div>

                    <!-- 5. Sanity Level -->
                    <div class="status-item">
                        <div class="status-info">
                            <span class="status-label">SANITY LEVEL</span>
                            <span class="status-value">90%</span>
                        </div>
                        <div class="bar-frame">
                            <div class="bar-fill sanity-fill" style="width: 90%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kotak Search Bar -->
            <div class="search-box">
                <input type="text" placeholder="Search" id="search-input">
            </div>
        </div>

        <!-- Tools -->
        <h2 class="section-title">TOOLS</h2>
        <div id="tools-slider" class="slider"></div>

        <!-- Games -->
        <h2 class="section-title">GAMES</h2>
        <div id="games-slider" class="slider"></div>

        <!-- Invitations -->
        <h2 class="section-title">INVITATIONS</h2>
        <div id="invitations-slider" class="slider"></div>

    </main>

    <!-- Container Footer (Dimuat otomatis oleh layout.js) -->
    <div id="footer"></div>

    <!-- Script JavaScript -->
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
