<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINWARDANA</title>
    <!-- Pastikan jalur file CSS ini benar -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Container Header (Dimuat otomatis oleh layout.js) -->
    <div id="header"></div>

    <!-- Konten Utama -->
    <main class="section">
        
        <!-- Hero Banner -->
        <div class="hero">
            <img src="assets/img/banner.jpg" alt="Banner" class="hero-image">
            <div class="hero-overlay">
                <h1>FINWARDANA HUB</h1>
                <p>Games • Tools • Projects</p>
            </div>
        </div>

        <!-- Recently Added -->
        <h2 class="section-title">RECENTLY ADDED</h2>
        <div id="recent-slider" class="slider"></div>

        <!-- Games -->
        <h2 class="section-title">GAMES</h2>
        <div id="games-slider" class="slider"></div>

        <!-- Tools -->
        <h2 class="section-title">TOOLS</h2>
        <div id="tools-slider" class="slider"></div>

        <!-- Invitations -->
        <h2 class="section-title">INVITATIONS</h2>
        <div id="invitations-slider" class="slider"></div>

    </main>

    <!-- Container Footer (Dimuat otomatis oleh layout.js) -->
    <div id="footer"></div>

    <!-- Script JavaScript -->
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
