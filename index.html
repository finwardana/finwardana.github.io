<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINWARDANA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#080808;
color:#fff;
padding-top:110px;
overflow-x:hidden;
}

a{
text-decoration:none;
color:inherit;
}

/* =========================
   HEADER
========================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:9999;
background:#080808;
border-bottom:1px solid #222;
}

.logo-bar{
height:58px;
display:flex;
align-items:center;
padding:0 18px;
font-size:22px;
font-weight:900;
letter-spacing:2px;
}

.navbar{
height:52px;
display:flex;
align-items:center;
overflow-x:auto;
overflow-y:hidden;
white-space:nowrap;
border-top:1px solid #151515;
scrollbar-width:none;
}

.navbar::-webkit-scrollbar{
display:none;
}

.navbar a{
flex:0 0 auto;
padding:0 18px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
color:#999;
transition:.2s;
}

.navbar a:hover{
color:#fff;
}

.navbar a.active{
color:#fff;
border-bottom:2px solid #f21f2b;
}

/* =========================
   HERO
========================= */

.hero{
min-height:40vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px 25px;
}

.hero h1{
font-size:clamp(48px,10vw,120px);
font-weight:900;
letter-spacing:-2px;
margin-bottom:15px;
}

.hero span{
color:#f21f2b;
}

.hero p{
max-width:700px;
color:#999;
line-height:1.9;
font-size:15px;
}

/* =========================
   RECENTLY ADDED
========================= */

.section{
padding:20px 18px 80px;
}

.section-title{
font-size:28px;
font-weight:800;
margin-bottom:25px;
}

.latest-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:18px;
}

.latest-card{
display:block;
background:#111;
border:1px solid #222;
border-radius:16px;
overflow:hidden;
transition:.25s;
}

.latest-card:hover{
transform:translateY(-4px);
border-color:#f21f2b;
}

.latest-thumb{
height:180px;
background:#1a1a1a;
background-size:cover;
background-position:center;
}

.latest-card h3{
padding:18px 18px 8px;
font-size:18px;
}

.latest-card p{
padding:0 18px 18px;
color:#999;
line-height:1.7;
font-size:14px;
}

/* =========================
   FOOTER
========================= */

footer{
padding:35px 20px;
text-align:center;
border-top:1px solid #222;
color:#777;
font-size:14px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:900px){

body{
padding-top:76px;
}

.header{
display:flex;
align-items:center;
height:76px;
}

.logo-bar{
height:76px;
padding:0 35px;
font-size:24px;
}

.navbar{
height:76px;
border-top:none;
margin-left:auto;
overflow:visible;
}

.navbar a{
height:76px;
padding:0 22px;
}

.hero{
min-height:50vh;
}

}

</style>
</head>
<body>

<header class="header">

<div class="logo-bar">
FINWARDANA
</div>

<nav class="navbar">

<a class="active" href="index.html">Home</a>
<a href="games/">Games</a>
<a href="tools/">Tools</a>
<a href="projects/">Projects</a>
<a href="invitation/">Invitation</a>
<a href="about/">About</a>

</nav>

</header>

<section class="hero">

<h1>FINWARDANA<span>.</span></h1>

<p>
Kumpulan game, tools, projects, invitation, dan karya digital.
</p>

</section>

<section class="section">

<h2 class="section-title">
RECENTLY ADDED
</h2>

<div class="latest-grid">

<a href="#" class="latest-card">

<div class="latest-thumb"></div>

<h3>Belum Ada Konten</h3>

<p>
Game, project, atau tools terbaru akan muncul di sini.
</p>

</a>

</div>

</section>

<footer>
© 2026 FINWARDANA
</footer>

</body>
</html>
